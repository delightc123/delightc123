<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 330" width="100%" height="100%">
  <defs>
    <!-- Titanium Silver / Liquid Metal Polygon Gradient -->
    <linearGradient id="titaniumRadarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" stop-opacity="0.32"/>
      <stop offset="50%" stop-color="#cbd5e1" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#94a3b8" stop-opacity="0.28"/>
    </linearGradient>
  </defs>

  <!-- Radar Background Grid -->
  <g>
    <polygon points="250.0,135.0 271.7,147.5 271.7,172.5 250.0,185.0 228.3,172.5 228.3,147.5" fill="none" stroke="#1e293b" stroke-width="1" stroke-dasharray="3,3"/>
    <polygon points="250.0,110.0 293.3,135.0 293.3,185.0 250.0,210.0 206.7,185.0 206.7,135.0" fill="none" stroke="#1e293b" stroke-width="1" stroke-dasharray="3,3"/>
    <polygon points="250.0,85.0 315.0,122.5 315.0,197.5 250.0,235.0 185.0,197.5 185.0,122.5" fill="none" stroke="#1e293b" stroke-width="1" stroke-dasharray="3,3"/>
    <polygon points="250.0,60.0 336.6,110.0 336.6,210.0 250.0,260.0 163.4,210.0 163.4,110.0" fill="none" stroke="#334155" stroke-width="1.2"/>
    <line x1="250.0" y1="160.0" x2="250.0" y2="60.0" stroke="#1e293b" stroke-width="1"/>
    <line x1="250.0" y1="160.0" x2="336.6" y2="110.0" stroke="#1e293b" stroke-width="1"/>
    <line x1="250.0" y1="160.0" x2="336.6" y2="210.0" stroke="#1e293b" stroke-width="1"/>
    <line x1="250.0" y1="160.0" x2="250.0" y2="260.0" stroke="#1e293b" stroke-width="1"/>
    <line x1="250.0" y1="160.0" x2="163.4" y2="210.0" stroke="#1e293b" stroke-width="1"/>
    <line x1="250.0" y1="160.0" x2="163.4" y2="110.0" stroke="#1e293b" stroke-width="1"/>
  </g>

  <!-- Animated Rotating Sweep Line in Liquid Silver -->
  <g transform="translate(250, 160)">
    <line x1="0" y1="0" x2="0" y2="-100" stroke="#cbd5e1" stroke-width="1.2" opacity="0.25">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Data Filled Hexagon: Titanium Silver -->
  <polygon points="250.0,62.0 333.1,112.0 331.4,207.0 250.0,250.0 170.3,206.0 171.2,114.5" fill="url(#titaniumRadarGrad)" stroke="#e2e8f0" stroke-width="1.8">
    <animate attributeName="stroke-opacity" values="0.75;1;0.75" dur="2.8s" repeatCount="indefinite"/>
  </polygon>

  <!-- Data Nodes -->
  
        <g>
          <circle cx="250.0" cy="62.0" r="3.5" fill="#ffffff"/>
          <circle cx="250.0" cy="62.0" r="7" fill="none" stroke="#cbd5e1" stroke-width="1.0" opacity="0.6">
            <animate attributeName="r" values="4;8;4" dur="2.4s" repeatCount="indefinite" begin="0.0s"/>
            <animate attributeName="opacity" values="0.7;0.1;0.7" dur="2.4s" repeatCount="indefinite" begin="0.0s"/>
          </circle>
        </g>
        
        <g>
          <circle cx="333.1" cy="112.0" r="3.5" fill="#ffffff"/>
          <circle cx="333.1" cy="112.0" r="7" fill="none" stroke="#cbd5e1" stroke-width="1.0" opacity="0.6">
            <animate attributeName="r" values="4;8;4" dur="2.4s" repeatCount="indefinite" begin="0.3s"/>
            <animate attributeName="opacity" values="0.7;0.1;0.7" dur="2.4s" repeatCount="indefinite" begin="0.3s"/>
          </circle>
        </g>
        
        <g>
          <circle cx="331.4" cy="207.0" r="3.5" fill="#ffffff"/>
          <circle cx="331.4" cy="207.0" r="7" fill="none" stroke="#cbd5e1" stroke-width="1.0" opacity="0.6">
            <animate attributeName="r" values="4;8;4" dur="2.4s" repeatCount="indefinite" begin="0.6s"/>
            <animate attributeName="opacity" values="0.7;0.1;0.7" dur="2.4s" repeatCount="indefinite" begin="0.6s"/>
          </circle>
        </g>
        
        <g>
          <circle cx="250.0" cy="250.0" r="3.5" fill="#ffffff"/>
          <circle cx="250.0" cy="250.0" r="7" fill="none" stroke="#cbd5e1" stroke-width="1.0" opacity="0.6">
            <animate attributeName="r" values="4;8;4" dur="2.4s" repeatCount="indefinite" begin="0.9s"/>
            <animate attributeName="opacity" values="0.7;0.1;0.7" dur="2.4s" repeatCount="indefinite" begin="0.9s"/>
          </circle>
        </g>
        
        <g>
          <circle cx="170.3" cy="206.0" r="3.5" fill="#ffffff"/>
          <circle cx="170.3" cy="206.0" r="7" fill="none" stroke="#cbd5e1" stroke-width="1.0" opacity="0.6">
            <animate attributeName="r" values="4;8;4" dur="2.4s" repeatCount="indefinite" begin="1.2s"/>
            <animate attributeName="opacity" values="0.7;0.1;0.7" dur="2.4s" repeatCount="indefinite" begin="1.2s"/>
          </circle>
        </g>
        
        <g>
          <circle cx="171.2" cy="114.5" r="3.5" fill="#ffffff"/>
          <circle cx="171.2" cy="114.5" r="7" fill="none" stroke="#cbd5e1" stroke-width="1.0" opacity="0.6">
            <animate attributeName="r" values="4;8;4" dur="2.4s" repeatCount="indefinite" begin="1.5s"/>
            <animate attributeName="opacity" values="0.7;0.1;0.7" dur="2.4s" repeatCount="indefinite" begin="1.5s"/>
          </circle>
        </g>
        

  <!-- Labels -->
  
        <g>
          <text x="250.0" y="34.0" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="#f8fafc">Autonomous Agents (OS/BWA)</text>
          <text x="250.0" y="46.0" text-anchor="middle" font-family="monospace" font-size="9" font-weight="600" fill="#94a3b8">[98%]</text>
        </g>
        
        <g>
          <text x="359.9" y="100.0" text-anchor="start" font-family="monospace" font-size="10" font-weight="700" fill="#f8fafc">Systems &amp; Architecture</text>
          <text x="359.9" y="112.0" text-anchor="start" font-family="monospace" font-size="9" font-weight="600" fill="#94a3b8">[96%]</text>
        </g>
        
        <g>
          <text x="359.9" y="220.0" text-anchor="start" font-family="monospace" font-size="10" font-weight="700" fill="#f8fafc">Full-Stack &amp; Mobile (React/Next/Expo)</text>
          <text x="359.9" y="232.0" text-anchor="start" font-family="monospace" font-size="9" font-weight="600" fill="#94a3b8">[94%]</text>
        </g>
        
        <g>
          <text x="250.0" y="292.0" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="#f8fafc">3D / WebGL / Shaders (Three/Godot)</text>
          <text x="250.0" y="304.0" text-anchor="middle" font-family="monospace" font-size="9" font-weight="600" fill="#94a3b8">[90%]</text>
        </g>
        
        <g>
          <text x="140.1" y="220.0" text-anchor="end" font-family="monospace" font-size="10" font-weight="700" fill="#f8fafc">Cloud &amp; DevOps (Docker/VPS/Sentry)</text>
          <text x="140.1" y="232.0" text-anchor="end" font-family="monospace" font-size="9" font-weight="600" fill="#94a3b8">[92%]</text>
        </g>
        
        <g>
          <text x="140.1" y="100.0" text-anchor="end" font-family="monospace" font-size="10" font-weight="700" fill="#f8fafc">FinTech &amp; Quantitative Systems</text>
          <text x="140.1" y="112.0" text-anchor="end" font-family="monospace" font-size="9" font-weight="600" fill="#94a3b8">[91%]</text>
        </g>
        
</svg>